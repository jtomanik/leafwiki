version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - ginkgolinter
    - govet
    - leafwiki
    - ineffassign
    - unused
    - errcheck
    - nilerr
    - nilnil
    - bodyclose
    - sqlclosecheck
  settings:
    custom:
      leafwiki:
        type: module
        description: LeafWiki semantic hygiene and i18n catalog analyzers.
        settings: {}
    ginkgolinter:
      allow-havelen-zero: true
      forbid-focus-container: true
      suppress-len-assertion: true
      validate-async-intervals: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
