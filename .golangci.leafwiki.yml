version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - ginkgolinter
    - govet
    - leafwiki
    - crap4go
    - ineffassign
    - unused
    - errcheck
    - nilerr
    - nilnil
    - bodyclose
    - sqlclosecheck
    - nolintlint
    - nilnesserr
    - rowserrcheck
    - exptostd
    - gochecksumtype
    - grouper
    - revive
  settings:
    custom:
      leafwiki:
        type: module
        description: LeafWiki semantic hygiene and i18n catalog analyzers.
        settings: {}
      crap4go:
        type: module
        description: Reports functions and methods with high CRAP scores.
        settings:
          coverage-profile: target/coverage/crap4go.out
          min-crap: 30
    ginkgolinter:
      allow-havelen-zero: true
      forbid-focus-container: true
      suppress-len-assertion: true
      validate-async-intervals: true
    revive:
      severity: error
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skip-comments: true
              skip-blank-lines: true
  exclusions:
    paths:
      - ^ui/leafwiki-ui/node_modules/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
